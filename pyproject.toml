[project]
name = "saas-tpm"
version = "0.1.0"
description = "Simulation environment that drops an LLM agent into a Technical Program Manager role for one work week at a small SaaS company"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.39"]
openai = ["openai>=1.50"]
dev = ["pytest>=8.0", "pytest-xdist>=3.5"]

[project.scripts]
sim = "sim.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
